spring.application.name=cricket-score-system

# ==========================================
# SERVER CONFIGURATION
# ==========================================

server.port=8080


# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/cricket_score_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

spring.datasource.username=root
spring.datasource.password=Aoi_Hoshizora


# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=true


# ==========================================
# JACKSON CONFIGURATION
# ==========================================

# No legacy spring.jackson.serialization setting is required
# for this Spring Boot 4 / Jackson 3 project.


# ==========================================
# HIKARI DATABASE CONNECTION POOL
# ==========================================

spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.minimum-idle=2

spring.datasource.hikari.connection-timeout=30000